name: Checks

# Manual provider checks against real APIs (they cost a little): Actions → Checks → Run workflow.
on:
  workflow_dispatch:
    inputs:
      check:
        description: What to run
        type: choice
        options: [fixtures-and-delete-check, fixtures-only, delete-check-only, bakeoff, diagnose-tryon, size-live]
        default: fixtures-and-delete-check
      shop:
        description: "Bake-off: the brand's Shopify site"
        type: string
        default: ""
      count:
        description: "Bake-off: number of products"
        type: string
        default: "8"
      max_usd:
        description: "Bake-off: spending cap in USD"
        type: string
        default: "5"
      providers:
        description: "Bake-off: only these (e.g. genlook); empty = all"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download stock model photos
        run: |
          mkdir -p "$RUNNER_TEMP/fx"
          node -e '
          const f = require("./scripts/fixtures.json").fixtures;
          for (const x of f) console.log(`${x.pexelsId} ${x.key.split("/").pop()}`);
          ' | while read -r id name; do
            curl -sSfL -o "$RUNNER_TEMP/fx/$name" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?h=2000&fm=jpg"
            file "$RUNNER_TEMP/fx/$name"
          done
      - name: Save them as the staging test photos (R2 fixtures/)
        if: inputs.check == 'fixtures-and-delete-check' || inputs.check == 'fixtures-only'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in "$RUNNER_TEMP"/fx/*.jpg; do
            pnpm exec wrangler r2 object put "garrab-files-staging/fixtures/$(basename "$f")" --file "$f" --content-type image/jpeg --remote
          done
      - name: Genlook delete check (1 real preview, about 0.04 USD)
        if: inputs.check == 'fixtures-and-delete-check' || inputs.check == 'delete-check-only'
        working-directory: apps/api
        env:
          GENLOOK_API_KEY: ${{ secrets.GENLOOK_API_KEY }}
        run: pnpm verify:genlook-delete -- "$RUNNER_TEMP/fx/model-a.jpg"
      - name: Diagnose failing try-ons (newest staging products, at most 1 preview)
        if: inputs.check == 'diagnose-tryon'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GENLOOK_API_KEY: ${{ secrets.GENLOOK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node ../../scripts/cf-provision.mjs staging >/dev/null
          echo "== AI spend by day and kind (last 4 days) =="
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT substr(created_at,1,10) AS day, kind, provider, COUNT(*) AS calls, ROUND(SUM(cost_micro_usd)/1e6, 2) AS usd FROM usage_events WHERE created_at >= datetime('now','-4 days') GROUP BY day, kind, provider ORDER BY day DESC, usd DESC"
          echo "== Tests per product (duplicates?) =="
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT a.name, p.title, COUNT(t.id) AS tests, MIN(t.created_at) AS first, MAX(t.created_at) AS last FROM product_tests t JOIN products p ON p.id = t.product_id JOIN accounts a ON a.id = t.account_id GROUP BY t.product_id ORDER BY tests DESC LIMIT 12"
          echo "== Spend by hour, last 24 h =="
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT substr(created_at,1,13) AS hour, kind, COUNT(*) AS calls, ROUND(SUM(cost_micro_usd)/1e6, 2) AS usd FROM usage_events WHERE created_at >= datetime('now','-1 day') GROUP BY hour, kind ORDER BY hour DESC LIMIT 40"
          echo "== Newest brands =="
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT name, category, status, onboarding_step, approved_at, created_at FROM accounts ORDER BY created_at DESC LIMIT 4"
          echo "== Their products =="
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT a.name AS brand, p.title, p.kind, p.selected, p.test_score, p.enabled, p.approved, p.brand_decision, p.disabled_reason FROM products p JOIN accounts a ON a.id = p.account_id WHERE p.selected = 1 ORDER BY p.created_at DESC LIMIT 8"
          echo "== Newest product tests =="
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT fixture, score, reason, created_at FROM product_tests ORDER BY created_at DESC LIMIT 6"
          echo "== Test photos in R2 =="
          pnpm exec wrangler r2 object get garrab-files-staging/fixtures/room-a.jpg --remote --file /tmp/ra.jpg >/dev/null 2>&1 && echo "room-a present" || echo "room-a MISSING"
          echo "== Recent shopper try-ons (newest first) =="
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT provider, ok, error_code, created_at FROM usage_events WHERE kind = 'tryon' ORDER BY created_at DESC LIMIT 10"
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT id, title, description, images_json, test_score FROM products ORDER BY rowid DESC LIMIT 3" > "$RUNNER_TEMP/p.json"
          pnpm exec wrangler d1 execute DB --env staging --remote --json \
            --command "SELECT kind, provider, ok, error_code, created_at FROM usage_events WHERE kind = 'test' ORDER BY created_at DESC LIMIT 6"
          echo "(paid Gemini call skipped: read-only diagnosis)"
      - name: Size finder live check (3 AI answers, a fraction of a cent)
        if: inputs.check == 'size-live'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/size-live.mjs
      - name: Bake-off (Genlook vs Google on the brand's products)
        if: inputs.check == 'bakeoff'
        working-directory: apps/api
        env:
          GENLOOK_API_KEY: ${{ secrets.GENLOOK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOP: ${{ inputs.shop }}
          COUNT: ${{ inputs.count }}
          MAX_USD: ${{ inputs.max_usd }}
          PROVIDERS: ${{ inputs.providers }}
        run: pnpm bakeoff -- --photos "$RUNNER_TEMP/fx" --shop "$SHOP" --count "$COUNT" --max-usd "$MAX_USD" ${PROVIDERS:+--providers "$PROVIDERS"}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.check == 'bakeoff'
        with:
          name: bakeoff
          path: docs/bakeoff/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.check == 'fixtures-and-delete-check' || inputs.check == 'delete-check-only')
        with:
          name: privacy-report
          path: docs/privacy/
          if-no-files-found: ignore
